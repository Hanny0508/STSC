    weights_sha256: "3ed21210e3642aea37c2fac20ad8b64e769eb59a0a98c9a961f4be71ccf1ffea"


  # Generation parameters
  generation:

    temperature: 1.0

    temperature_alpha: 1.25

    top_k: null

    top_p: null

    max_new_tokens: 160


  # Cover text generation

  cover_generation:

    n_cover: 3

    seed_gen_seed: 2023


  # Embedding algorithm

  embedding:

    method: huffman

    egs_mode: huffman

    threshold: 0.002

    max_bpw: 5


  # Synchronization information

  synchronization:

    require_same_model: true

    require_same_tokenizer: true

    require_same_generation_parameters: true

    verify_hash_before_decode: true



