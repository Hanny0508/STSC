    name: Llama-2-7B-chat-GPTQ

    provider:
      type: huggingface

    path: "legacy/zero-shot-GLS/tmp_saves/local_models/llama-2-7b-chat-gptq-4bit-32g-actorder"

    tokenizer_path: "legacy/zero-shot-GLS/tmp_saves/local_models/llama-2-7b-chat-gptq-4bit-32g-actorder"

