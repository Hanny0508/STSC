[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "zsc-tsd"
version = "0.7.0"
description = "Compatibility-oriented implementation of ZSC-TSD for text-domain steganography with speech transport."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Research use; see third-party licenses in legacy components." }

authors = [
    { name = "ZSC-TSD Authors" }
]

keywords = [
    "generative steganography",
    "text steganography",
    "text-to-speech",
    "speech transmission",
    "voip",
    "iot"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]


# Keep the root integration environment small.
#
# Heavy dependencies for ZTS, TTS, ASR, and evaluation are isolated
# in requirements/zts.txt, requirements/tts.txt,
# requirements/asr.txt, and requirements/evaluation.txt.
dependencies = [
    "PyYAML>=6.0,<7",
    "cryptography>=42,<47",
    "typing-extensions>=4.10,<5"
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7"
]
control = [
    "psycopg[binary]>=3.2,<4"
]

[project.scripts]
zsc-tsd = "zsc_tsd.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["zsc_tsd*"]
exclude = [
    "legacy*",
    "tests*",
    "tools*",
    "experiments*",
    "artifacts*"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]
markers = [
    "integration: requires local model files and one or more model environments",
    "gpu: requires a CUDA-capable GPU",
    "two_host: requires the A/B Tailscale testbed",
]


[tool.coverage.run]
source = ["zsc_tsd"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]
